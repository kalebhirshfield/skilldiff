services:
  redis:
    image: redis:alpine
    container_name: skilldiff-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: skilldiff-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  celery_worker:
    build: ./backend
    container_name: skilldiff-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    container_name: skilldiff-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
